name: UI Screenshot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ui-screenshot
  cancel-in-progress: true

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Boot simulator
        run: |
          xcrun simctl boot "iPhone 18 Pro" || true
          xcrun simctl bootstatus booted -b
      - name: Build
        run: |
          xcodebuild -project BlankTabView.xcodeproj -scheme BlankTabView \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro' \
            -configuration Release \
            -derivedDataPath build build 2>&1 | tail -40
      - name: Install
        run: |
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          xcrun simctl install booted "$APP"
      - name: Shots
        run: |
          mkdir -p build
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab home 2>&1 | tee build/launch-home.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-home.png"
          echo "shot home done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile 2>&1 | tee build/launch-profile.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-profile.png"
          echo "shot profile done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab search 2>&1 | tee build/launch-search.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-search.png"
          echo "shot search done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile -demoSkin 2>&1 | tee build/launch-sheet.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-sheet.png"
          echo "shot sheet done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile -demoSkinLocked 2>&1 | tee build/launch-skinlocked.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-skinlocked.png"
          echo "shot skinlocked done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile -demoSkins 2>&1 | tee build/launch-skins.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-skins.png"
          echo "shot skins done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile -demoSeries 2>&1 | tee build/launch-series.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-series.png"
          echo "shot series done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile -demoMedalSheet 2>&1 | tee build/launch-medalsheet.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-medalsheet.png"
          echo "shot medalsheet done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile -demoMedals 2>&1 | tee build/launch-medals.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-medals.png"
          echo "shot medals hall done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile -demoRank 2>&1 | tee build/launch-rank.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-rank.png"
          echo "shot rank done"

          echo "== crash reports =="
          ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5 || true
          for f in ~/Library/Logs/DiagnosticReports/*BlankTabView*; do
            [ -f "$f" ] && { echo "--- $f"; head -80 "$f"; }
          done || true
