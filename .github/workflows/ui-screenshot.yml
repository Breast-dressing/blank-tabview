name: UI Screenshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild -project BlankTabView.xcodeproj -scheme BlankTabView \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.2' \
            -derivedDataPath build/DD CODE_SIGNING_ALLOWED=NO

      - name: Screenshot each tab
        run: |
          set -euo pipefail
          APP=$(find build/DD/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          xcrun simctl boot "iPhone 18 Pro" || true
          xcrun simctl bootstatus "iPhone 18 Pro" -b
          xcrun simctl install booted "$APP"
          xcrun simctl io booted screenshot build/shot-before.png || true
          for tab in home profile search; do
            xcrun simctl terminate booted com.breastdressing.blanktabview || true
            xcrun simctl launch booted com.breastdressing.blanktabview -startTab "$tab" 2>&1 | tee "build/launch-$tab.txt"
            sleep 9
            xcrun simctl io booted screenshot "build/shot-$tab.png"
            echo "shot $tab done"
          done
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile -demoSkin 2>&1 | tee build/launch-sheet.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-sheet.png"
          echo "shot sheet done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile -demoSkinLocked 2>&1 | tee build/launch-skinlocked.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-skinlocked.png"
          echo "shot locked skin done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile -demoSkins 2>&1 | tee build/launch-skins.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-skins.png"
          echo "shot skins done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile -demoSeries 2>&1 | tee build/launch-series.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-series.png"
          echo "shot series done"
          xcrun simctl terminate booted com.breastdressing.blanktabview || true
          xcrun simctl launch booted com.breastdressing.blanktabview -startTab profile -demoMedalSheet 2>&1 | tee build/launch-medalsheet.txt
          sleep 9
          xcrun simctl io booted screenshot "build/shot-medalsheet.png"
          echo "shot medal sheet done"

          echo "== crash reports =="
          ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5 || true
          for f in ~/Library/Logs/DiagnosticReports/*BlankTabView*; do
            [ -f "$f" ] && { echo "--- $f"; head -80 "$f"; }
          done || true
          ls -l build/shot-*.png build/launch-*.txt

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            build/shot-*.png
            build/launch-*.txt
          retention-days: 7

      - name: Publish screenshots to release
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view ui-shots >/dev/null 2>&1 || \
            gh release create ui-shots --title "UI screenshots" --notes "交付前的模拟器截图。" --latest=false
          for f in build/shot-*.png build/launch-*.txt; do
            [ -f "$f" ] && gh release upload ui-shots "$f" --clobber
          done
          echo "published"
