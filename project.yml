name: BlankTabView
options:
  bundleIdPrefix: com.breastdressing
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_PREVIEWS: YES

targets:
  BlankTabView:
    type: application
    platform: iOS
    sources:
      - path: Sources/BlankTabView
    info:
      path: Sources/BlankTabView/Info.plist
      properties:
        CFBundleDisplayName: 三页
        CFBundleName: BlankTabView
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breastdressing.blanktabview
        PRODUCT_NAME: BlankTabView
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  BlankTabViewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/BlankTabViewTests
    dependencies:
      - target: BlankTabView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breastdressing.blanktabview.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BlankTabView:
    build:
      targets:
        BlankTabView: all
        BlankTabViewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: BlankTabViewTests
    archive:
      config: Release
